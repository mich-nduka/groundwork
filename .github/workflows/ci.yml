name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported versions. Python 3.9 is what macOS ships, and is
          # no longer offered on the newest Ubuntu runners.
          - { os: ubuntu-24.04, node: 22, python: "3.9" }
          - { os: macos-latest, node: 22, python: "3.9" }
          # Current versions.
          - { os: ubuntu-latest, node: 24, python: "3.13" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: python3 template/scripts/check_docs.py --strict --strict-coverage
      - run: bun run test
