name: Release

# Publishes to npm when a version tag (v3.1.0, ...) is pushed. Nothing is
# published until a maintainer pushes such a tag and NPM_TOKEN is set.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json and template versions
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          test "$(node -p "require('./package.json').version")" = "$(node -p "require('./template/scaffold-manifest.json').version")"
      - run: bun run test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
