name: Release

# Publishes to npm when a version tag (v3.2.0, ...) is pushed, using npm
# trusted publishing (OIDC): no token is stored anywhere. npmjs.com trusts
# this workflow (mich-nduka/groundwork, release.yml) to publish
# create-groundwork; nothing is published until a maintainer pushes a tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # npm 11.5.1+ is needed for trusted publishing
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json and template versions
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          test "$(node -p "require('./package.json').version")" = "$(node -p "require('./template/scaffold-manifest.json').version")"
      - run: bun run test
      - run: npm install -g npm@latest && npm --version
      - run: npm publish --provenance --access public
